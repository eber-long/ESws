<!DOCTYPE html>

                <span class="icon">
                    <svg class="nav-icon" style="color: currentColor;" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                        <path fill-rule="evenodd" d="M4 4a2 2 0 0 0-2 2v12a2 2 0 0 0 .087.586l2.977-7.937A1 1 0 0 1 6 10h12V9a2 2 0 0 0-2-2h-4.532l-1.9-2.28A2 2 0 0 0 8.032 4H4Zm2.693 8H6.5l-3 8H18l3-8H6.693Z" clip-rule="evenodd"/>
                    </svg>
                </span> Productos
            </a>
            <a href="admin.html" class="nav-link">

                        <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M16 12h4m-2 2v-4M4 18v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1M13 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                    </svg>
                </span> Usuarios
            </a>
            <a href="admin.html" class="nav-link">
                <span class="icon">
                    <svg class="nav-icon" style="color: currentColor;" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                        <path fill-rule="evenodd" d="M4 4a2 2 0 0 0-2 2v12a2 2 0 0 0 .087.586l2.977-7.937A1 1 0 0 1 6 10h12V9a2 2 0 0 0-2-2h-4.532l-1.9-2.28A2 2 0 0 0 8.032 4H4Zm2.693 8H6.5l-3 8H18l3-8H6.693Z" clip-rule="evenodd"/>

                    </svg>
                </span> Descuentos
            </a>
            <a href="admin-auditoria.html" class="nav-link active">
                <span class="icon">
                    <svg class="nav-icon" style="color: currentColor;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">

        <div class="sidebar-footer">
            <a href="#" id="adminLogout">
                <span class="icon">
                    <svg class="nav-icon" style="color: currentColor;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M20 12H8m12 0-4 4m4-4-4-4M9 4H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h2"/>

                </span> Cerrar sesión
            </a>
        </div>
    </aside>

    <!-- ============================================
         📄 MAIN CONTENT
    ============================================ -->
    <main class="admin-main">
        <!-- Top Bar -->
        <div class="admin-topbar">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="btn-mobile-menu" id="mobileMenuBtn">☰</button>
                <h1>Auditoría de Stock</h1>
            </div>
            <div class="topbar-actions">
                <div class="topbar-user" style="display: inline-flex; align-items: center; gap: 8px;">
                    <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-width="2" d="M7 17v1a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1a3 3 0 0 0-3-3h-4a3 3 0 0 0-3 3Zm8-9a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                    </svg>
                    <strong id="adminName">Admin</strong>
                </div>
            </div>
        </div>

        <div class="admin-content">
            <!-- Auditoria Section -->
            <div class="admin-section active" style="display: block;">
                <div class="section-header" style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
                    <h2>Historial de Movimientos de Inventario</h2>
                    <button class="btn btn-primary" id="btnRefreshAudit" style="display: inline-flex; align-items: center; gap: 8px;">
                        🔄 Actualizar
                    </button>
                </div>

                <div class="table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Usuario</th>
                                <th>Producto</th>
                                <th>Stock Anterior</th>
                                <th>Stock Nuevo</th>
                                <th>Diferencia</th>
                            </tr>
                        </thead>
                        <tbody id="auditTableBody">
                            <tr>
                                <td colspan="6" style="text-align: center; padding: 40px; color: var(--admin-text-muted);">
                                    Cargando historial de auditoría...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/admin-auditoria.js"></script>

</html>
